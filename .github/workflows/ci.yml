name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  runtime-packaging:
    name: Versioned client package and offset references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Test Address Library references and package publication
        run: |
          node tests/address-offsets.mjs
          node tests/runtime-packaging.mjs

  php-auth:
    name: PHP hosting and native sessions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl
          coverage: none
      - name: Test independent PHP document roots
        env:
          PHP_BINARY: php
        run: |
          node tests/php-master-smoke.mjs
          node tests/launcher-account.mjs
      - name: Test crash storage and developer portal
        env:
          PHP_BINARY: php
        run: |
          node tests/crash-reports.mjs
          node tests/dev-portal.mjs --webroot-reports
          node tests/dev-report-storage.mjs

  master-api:
    name: Online authentication and server sessions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test auth master
        working-directory: master-api
        run: npm test

  build:
    name: Build (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location launcher
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location launcher
          npm run build

      - name: Test official launcher version checks
        shell: pwsh
        run: node tests/launcher-updates.mjs

      - name: Cargo check (Tauri backend)
        shell: pwsh
        run: |
          Set-Location launcher/src-tauri
          cargo check

      - name: Test server synchronization and restoration
        shell: pwsh
        run: |
          Set-Location launcher/src-tauri
          cargo test --no-default-features --lib
